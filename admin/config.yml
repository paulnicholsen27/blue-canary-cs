media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: paulnicholsen27/blue-canary-cs
  branch: production
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b9dcf352-848d-400b-b265-ca46692bd0ce/pkce
  auth_token_endpoint: /sites/b9dcf352-848d-400b-b265-ca46692bd0ce/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://www.bluecanarywebdesign.com/assets/logos/vert_rt_icononly_transparent_nobuffer_sm.webp

# Add site links in Decap CMS (optional)
site_url: https://www.bluecanarywebdesign.com

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Share Image", name: "shareImage", widget: "image", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
