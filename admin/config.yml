media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: paulnicholsen27/blue-canary-cs
  branch: production
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b9dcf352-848d-400b-b265-ca46692bd0ce/pkce
  auth_token_endpoint: /sites/b9dcf352-848d-400b-b265-ca46692bd0ce/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo:
  src: https://www.bluecanarywebdesign.com/assets/logos/vert_rt_icononly_transparent_nobuffer_sm.webp
  show_in_header: true

# Add site links in Decap CMS (optional)
site_url: https://www.bluecanarywebdesign.com

collections:
  - name: "site-pages"
    label: "Page Content"
    files:
      - name: "home"
        label: "Home Page"
        file: "_data/home.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }
          - label: "Services Preview"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - label: "Service Cards"
                name: "items"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
              - { label: "Link Text", name: "linkText", widget: "string" }
              - { label: "Link", name: "linkUrl", widget: "string" }
          - label: "Testimonials"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "string" }
              - { label: "Reviews Link", name: "sourceUrl", widget: "string" }
              - label: "Reviews"
                name: "items"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Client", name: "name", widget: "string" }
                  - { label: "Client Website", name: "url", widget: "string" }
                  - { label: "Website Label", name: "siteLabel", widget: "string" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "_data/about.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Our Story"
            name: "story"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "title", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "Desktop Image", name: "imageDesktop", widget: "image" }
              - { label: "Tablet Image", name: "imageTablet", widget: "image" }
              - { label: "Mobile Image", name: "imageMobile", widget: "image" }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
          - label: "Values"
            name: "values"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - label: "Values List"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }

      - name: "services"
        label: "Services Page"
        file: "_data/services.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Services"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Why Choose Us"
            name: "benefits"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - label: "Benefits"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
          - label: "Our Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Intro", name: "body", widget: "text" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }

      - name: "pricing"
        label: "Pricing Page"
        file: "_data/pricing.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Plans"
            name: "plans"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Plan Name", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Price Note", name: "note", widget: "string" }
              - { label: "Featured Plan", name: "featured", widget: "boolean", required: false }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }
          - label: "Nonprofit Note"
            name: "nonprofit"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }

      - name: "gallery"
        label: "Gallery Page"
        file: "_data/gallery.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Name", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "string" }
              - { label: "Project Link", name: "url", widget: "string" }
              - { label: "Screenshot", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "alt", widget: "string" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonUrl", widget: "string" }

      - name: "site-settings"
        label: "Site Settings"
        file: "_data/site.json"
        format: "json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "Default Share Image", name: "defaultShareImage", widget: "image" }
          - { label: "Header Logo", name: "logo", widget: "image" }
          - { label: "Footer Logo", name: "footerLogo", widget: "image" }
          - label: "Contact Details"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Intro Text", name: "body", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Email Label", name: "emailLabel", widget: "string" }
              - { label: "Phone Display", name: "phone", widget: "string" }
              - { label: "Phone Link Digits", name: "phoneLink", widget: "string" }
              - { label: "Phone Label", name: "phoneLabel", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
              - { label: "Google Business URL", name: "google", widget: "string" }
              - { label: "Submit Button", name: "submitText", widget: "string" }

  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    preview_path: blog/{{slug}}
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Share Image", name: "shareImage", widget: "image", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

publish_mode: editorial_workflow
show_preview_links: true
